name: prestamos_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Database
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # JWT & Auth
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.2.2
  
  # State Management
  flutter_bloc: ^8.1.3
  
  # Dependency Injection
  get_it: ^7.6.4
  
  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1
  
  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.18.1
  fl_chart: ^0.69.0
  pie_chart: ^5.3.2
  rename_app: ^1.6.5
  flutter_launcher_icons: ^0.13.1
  rxdart: ^0.27.7


dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.6
  drift_dev: ^2.29.0
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

